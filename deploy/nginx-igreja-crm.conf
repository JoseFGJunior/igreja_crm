server {
    server_name eloperfeito.net.br www.eloperfeito.net.br;
    client_max_body_size 10M;

    location /static/ {
        alias /opt/igreja_crm/staticfiles/;
    }

    location /media/ {
        alias /opt/igreja_crm/media/;
    }

    location = /app {
        return 301 /app/;
    }

    location ^~ /app/ {
        alias /opt/igreja_crm/mobile-web/;
        try_files $uri $uri/ /app/index.html;
    }

    location ^~ /_expo/ {
        alias /opt/igreja_crm/mobile-web/_expo/;
    }

    location ^~ /assets/ {
        alias /opt/igreja_crm/mobile-web/assets/;
    }

    location = /app/sw.js {
        alias /opt/igreja_crm/mobile-web/sw.js;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/eloperfeito.net.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eloperfeito.net.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name eloperfeito.net.br www.eloperfeito.net.br;
    return 301 https://$host$request_uri;
}
