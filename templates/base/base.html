{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        CRM Igreja
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>

    <div class="app-layout d-flex">

        {% include 'base/sidebar.html' %}

        <div class="sidebar-backdrop" data-sidebar-close></div>

        <div class="main-content flex-grow-1">

            {% include 'base/navbar.html' %}

            <div class="container-fluid main-container">

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <div class="alert {% if environment == 'production' %}alert-danger{% else %}alert-warning{% endif %} py-2 mb-3" role="status">
                    <i class="bi {% if environment == 'production' %}bi-exclamation-octagon{% else %}bi-tools{% endif %}"></i>
                    Ambiente: <strong>{{ environment_display }}</strong>
                </div>

                {% block content %}
                {% endblock %}

            </div>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script>
        (() => {
            const sidebar = document.getElementById('app-sidebar');
            const body = document.body;

            document.querySelectorAll('[data-sidebar-toggle]').forEach((button) => {
                button.addEventListener('click', () => {
                    const isOpen = sidebar.classList.toggle('is-open');
                    body.classList.toggle('sidebar-open', isOpen);
                    button.setAttribute('aria-expanded', isOpen);
                });
            });

            document.querySelectorAll('[data-sidebar-close]').forEach((element) => {
                element.addEventListener('click', () => {
                    sidebar.classList.remove('is-open');
                    body.classList.remove('sidebar-open');
                    document.querySelectorAll('[data-sidebar-toggle]').forEach((button) => {
                        button.setAttribute('aria-expanded', 'false');
                    });
                });
            });
        })();
    </script>

    {% block scripts %}
    {% endblock %}

</body>
</html>
