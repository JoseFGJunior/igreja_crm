{% extends 'base/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><div><h4 class="mb-1">Mensagens do WhatsApp</h4><span class="text-muted">{{ igreja.nome }}</span></div><a href="{% url 'visitante_dashboard' %}" class="btn btn-outline-secondary">Voltar</a></div>
<div class="alert alert-info">O nome da igreja será acrescentado automaticamente ao final da mensagem.</div>
<form method="post">{% csrf_token %}{% for tipo,mensagem in mensagens.items %}<div class="card shadow-sm mb-3"><div class="card-body"><label class="form-label"><strong>{{ mensagem.get_tipo_display }}</strong></label><textarea name="mensagem_{{ tipo }}" class="form-control" rows="8" required>{{ mensagem.mensagem }}</textarea></div></div>{% endfor %}<div class="text-end"><button class="btn btn-primary">Salvar mensagens</button></div></form>
{% endblock %}
