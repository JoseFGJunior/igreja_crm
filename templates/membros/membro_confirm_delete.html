{% extends 'base/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h4 class="mb-1">
            Excluir membro
        </h4>

        <span class="text-muted">
            {{ igreja.nome }}
        </span>
    </div>

    <a href="{% url 'membro_list' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
        Voltar
    </a>

</div>

<div class="card shadow-sm">

    <div class="card-body">

        <p class="mb-4">
            Confirma a exclusao do membro <strong>{{ membro.nome }}</strong>?
        </p>

        <form method="post">

            {% csrf_token %}

            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'membro_list' %}" class="btn btn-outline-secondary">
                    Cancelar
                </a>

                <button class="btn btn-danger">
                    <i class="bi bi-trash"></i>
                    Excluir
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
