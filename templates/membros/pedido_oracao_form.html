{% extends 'base/base.html' %}
{% block content %}<div class="d-flex justify-content-between align-items-center mb-4"><div><h4 class="mb-1">{{ titulo }}</h4><span class="text-muted">{{ igreja.nome }}</span></div><a href="{% url 'pedido_oracao_list' %}" class="btn btn-outline-secondary">Voltar</a></div><div class="card shadow-sm"><div class="card-body"><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Nome</label>{{ form.nome }}{{ form.nome.errors }}</div><div class="col-md-6"><label class="form-label">Telefone *</label>{{ form.telefone }}{{ form.telefone.errors }}</div><div class="col-12"><label class="form-label">Pedido de oração *</label>{{ form.pedido }}{{ form.pedido.errors }}</div><div class="col-12"><div class="form-check">{{ form.atendido }}<label class="form-check-label" for="{{ form.atendido.id_for_label }}">Pedido já foi atendido</label></div></div></div><div class="text-end mt-4"><button class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar pedido</button></div></form></div></div>{% endblock %}
