{% extends 'base/base.html' %}
{% block content %}<div class="card shadow-sm"><div class="card-body"><h4>Excluir pedido de oração</h4><p>Tem certeza que deseja excluir este pedido?</p><div class="border rounded p-3 mb-4"><strong>{{ pedido.nome|default:'Anônimo' }}</strong><p class="mb-0 mt-2" style="white-space:pre-line">{{ pedido.pedido }}</p></div><form method="post">{% csrf_token %}<a href="{% url 'pedido_oracao_list' %}" class="btn btn-outline-secondary">Cancelar</a> <button class="btn btn-danger"><i class="bi bi-trash"></i> Excluir pedido</button></form></div></div>{% endblock %}
